<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>миста сма🚜🚜n</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            font-family: "Comic Sans MS", "Chalkboard SE", sans-serif;
            overflow: hidden;
            perspective: 1000px; 
        }

        #det-button {
            width: 100%;
            height: 100%;
            background-color: #c0c0c0;
            border: 10px outset #ffffff;
            font-size: 80px;
            font-weight: bold;
            color: #000000;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
        }

        #det-button:active {
            border-style: inset;
        }

        #magic-zone {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            text-align: center;
        }

        h1 {
            color: #8a2be2;
            font-size: 45px;
            margin-top: 40px;
            text-shadow: 2px 2px #ff00ff;
            padding: 0 10px;
        }

        .smart-pic {
            position: absolute;
            width: 140px;
            height: 140px;
            border: 3px solid #8a2be2; 
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(138, 43, 226, 0.3);
            background-color: white;
            transition: left 2s linear, top 2s ease-in-out;
            transform-style: preserve-3d;
            animation: spin3D var(--spin-time) infinite linear;
            animation-delay: var(--delay-time);
        }

        @keyframes spin3D {
            0% {
                transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg);
            }
            100% {
                transform: rotateX(var(--rotX)) rotateY(var(--rotY)) rotateZ(var(--rotZ));
            }
        }

        .confetti {
            position: absolute;
            width: 15px;
            height: 15px;
            animation: fly 3s forwards linear;
        }

        @keyframes fly {
            0% {
                transform: translate(0, 0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translate(var(--x), var(--y)) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <button id="det-button" onclick="startMagic()">Кнопка</button>

    <div id="magic-zone">
        <h1>привет друзя с HSK 2 с Mister Smart! -КОСТЯ</h1>
    </div>

<script>

        document.getElementById('magic-zone').style.display = 'block';

        const count = 4; 

        for (let i = 0; i < count; i++) {
            const img = document.createElement('img');
            img.src = imgSrc;
            img.className = 'smart-pic';

            img.style.left = Math.random() * 70 + 5 + '%';
            img.style.top = Math.random() * 50 + 30 + '%';

            const rotX = (Math.random() > 0.5 ? 360 : -360) * (Math.floor(Math.random() * 3) + 1) + 'deg';
            const rotY = (Math.random() > 0.5 ? 360 : -360) * (Math.floor(Math.random() * 3) + 1) + 'deg';
            const rotZ = (Math.random() > 0.5 ? 360 : -360) * (Math.floor(Math.random() * 2) + 1) + 'deg';
            const spinTime = (Math.random() * 3 + 2) + 's'; 
            const delayTime = (Math.random() * 2) + 's';

            img.style.setProperty('--rotX', rotX);
            img.style.setProperty('--rotY', rotY);
            img.style.setProperty('--rotZ', rotZ);
            img.style.setProperty('--spin-time', spinTime);
            img.style.setProperty('--delay-time', delayTime);

            magicZone.appendChild(img);

            moveAndJump(img);
            setInterval(() => moveAndJump(img), 2000);
        }

        spawnConfetti('left');
        spawnConfetti('right');
    }

    function moveAndJump(element) {
        const randomX = Math.random() * 80 + '%';
        const randomY = Math.random() * 55 + 30 + '%'; 
        element.style.left = randomX;
        element.style.top = randomY;
    }

    function spawnConfetti(side) {
        const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff', '#ff9900'];
        for (let i = 0; i < 40; i++) {
            const confetti = document.createElement('div');
            confetti.className = 'confetti';
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.top = Math.random() * 80 + 10 + '%';
            
            if (side === 'left') {
                confetti.style.left = '0px';
            } else {
                confetti.style.right = '0px';
            }

            const xDist = side === 'left' ? (Math.random() * 500 + 200) : -(Math.random() * 500 + 200);
            const yDist = (Math.random() * 500) - 250;

            confetti.style.setProperty('--x', `${xDist}px`);
            confetti.style.setProperty('--y', `${yDist}px`);
            
            document.body.appendChild(confetti);
            setTimeout(() => confetti.remove(), 3000);
        }
    }
</script>

</body>
</html>
