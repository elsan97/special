<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mistre smart </title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            font-family: "Comic Sans MS", "Chalkboard SE", sans-serif;
            overflow: hidden;
            perspective: 1000px; 
        }

        #det-button {
            width: 100%;
            height: 100%;
            background-color: #c0c0c0;
            border: 10px outset #ffffff;
            font-size: 80px;
            font-weight: bold;
            color: #000000;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
            position: relative;
            z-index: 10;
        }

        #det-button:active {
            border-style: inset;
        }

        #magic-zone {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            text-align: center;
        }

        h1 {
            color: #8a2be2;
            font-size: 45px;
            margin-top: 40px;
            text-shadow: 2px 2px #ff00ff;
            padding: 0 10px;
        }

        .smart-wrapper {
            position: absolute;
            bottom: 15%;
            width: 140px;
            height: 140px;
            transition: left var(--move-time) linear; 
            
            animation: heavyJump 0.45s infinite alternate cubic-bezier(0.6, 0.05, 0.4, 1);
        }

        .smart-pic {
            width: 100%;
            height: 100%;
            border: 3px solid #8a2be2; 
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(138, 43, 226, 0.3);
            background-color: white;
            
            transform-style: preserve-3d;
            animation: spinRight var(--spin-time) infinite linear;
        }

        @keyframes heavyJump {
            0% {
                transform: translateY(0);
            }
            100% {
                transform: translateY(-240px); 
            }
        }

        @keyframes spinRight {
            0% {
                transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg);
            }
            100% {
                transform: rotateX(0deg) rotateY(360deg) rotateZ(0deg);
            }
        }

        .confetti {
            position: absolute;
            width: 15px;
            height: 15px;
            animation: fly 3s forwards linear;
        }

        @keyframes fly {
            0% {
                transform: translate(0, 0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translate(var(--x), var(--y)) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <button id="det-button" onclick="startMagic()">КНОПКА</button>

    <div id="magic-zone">
        <h1>привет друзя с HSK 2 с mister smart!</h1>
    </div>

<script>
    function startMagic() {
        document.getElementById('det-button').style.display = 'none';
        document.getElementById('magic-zone').style.display = 'block';

        const magicZone = document.getElementById('magic-zone');
        const imgSrc = encodeURIComponent("images (6).jpg");

        const count = 4; 

        for (let i = 0; i < count; i++) {
            const wrapper = document.createElement('div');
            wrapper.className = 'smart-wrapper';
            wrapper.style.left = Math.random() * 80 + '%'; 
            
            wrapper.style.animationDelay = `-${Math.random() * 0.45}s`;

            const img = document.createElement('img');
            img.src = imgSrc;
            img.className = 'smart-pic';

            const spinTime = (Math.random() * 0.4 + 0.8) + 's';
            img.style.setProperty('--spin-time', spinTime);

            wrapper.appendChild(img);
            magicZone.appendChild(wrapper);
            keepMoving(wrapper);
        }

        spawnConfetti('left');
        spawnConfetti('right');
    }

    function keepMoving(element) {
        const randomX = Math.random() * 80 + '%';
        const moveTime = (Math.random() * 0.05 + 1); 

        element.style.setProperty('--move-time', moveTime + 's');
        element.style.left = randomX;

        setTimeout(() => {
            keepMoving(element);
        }, moveTime * 1000);
    }

    function spawnConfetti(side) {
        const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff', '#ff9900'];
        for (let i = 0; i < 40; i++) {
            const confetti = document.createElement('div');
            confetti.className = 'confetti';
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.top = Math.random() * 80 + 10 + '%';
            
            if (side === 'left') {
                confetti.style.left = '0px';
            } else {
                confetti.style.right = '0px';
            }

            const xDist = side === 'left' ? (Math.random() * 500 + 200) : -(Math.random() * 500 + 200);
            const yDist = (Math.random() * 500) - 250;

            confetti.style.setProperty('--x', `${xDist}px`);
            confetti.style.setProperty('--y', `${yDist}px`);
            
            document.body.appendChild(confetti);
            setTimeout(() => confetti.remove(), 3000);
        }
    }
</script>

</body>
</html>
